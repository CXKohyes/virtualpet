# 像素宠物屋 —— nginx 站点配置
#
# 安装：sudo cp deploy/nginx-pet.conf /etc/nginx/conf.d/pet.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
# 设计要点：**前后端同源**。静态文件由 nginx 直接发，/api 和 /ws 反代到本机后端。
# 于是前端一行都不用改 —— 它本来用的就是相对路径（axios baseURL 是 /api/v1，
# WebSocket 是 ws://<当前 host>/ws），同源下天然就对。
# 同源还顺带免掉了 CORS：后端至今没有跨域配置，也不需要加。

server {
    listen 80;
    server_name _;

    root /opt/pet/pet-web;
    index index.html;

    # 本项目没有上传接口，把请求体上限收到 1MB
    client_max_body_size 1m;

    # 构建产物带内容哈希，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查必须放在 SPA 兜底**之前**单独处理，否则会被兜到 index.html：
    # `try_files` 找不到文件就回落，于是 GET /actuator/health 会返回
    # 200 + 一坨 HTML —— 外部监控拿到 200 就认为服务正常，**后端挂了也报健康**。
    #
    # 只放行 health 这一个端点，不要开 /actuator/ 整个前缀：
    # 其余端点（env、beans 之类）没有暴露的必要。
    location = /health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA 兜底。router 用的是 createWebHistory，直接访问 /battle 这类二级路由
    # 或在那上面刷新时，磁盘上并没有对应文件，必须回落到 index.html —— 否则 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 恰恰不能缓存：它引用的 /assets/xxx-<hash>.js 每次都变，
    # 缓存住它就会让用户拿着旧壳子去请求已经不存在的旧资源。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket（STOMP，端点是 /ws）。
    # 注意：这个 location 不要写成 /ws/ —— 前端连的就是 /ws，带斜杠匹配不上。
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 这两个头是 WebSocket 升级必需的，少了握手直接被拒
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 默认 60 秒没有数据往来就断。战报就绪通知是稀疏事件，
        # 可能几十分钟才有一条，不调长的话连接会被反复掐断重连。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------------------------------------------------------------------------
# 有域名并通过 ICP 备案之后，用 certbot 换 HTTPS：
#   sudo certbot --nginx -d pet.example.com
# 它会自动改写上面这个 server 块并加上 80→443 跳转。
#
# 换成 HTTPS 之后，记得把后端的 PET_ALLOWED_ORIGINS 从 http:// 改成 https://，
# 否则 WebSocket 握手会因为来源对不上被 403 拒掉。
# ---------------------------------------------------------------------------
